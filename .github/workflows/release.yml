name: Release

# 第三道防线（opensource-guard）：打 tag 即发布，发布前最后复检一遍。
#
# 流程：校验版本一致 → 语法检查 → 敏感内容复检 → 打包 → 建 Release
#
# 用法：
#   git tag v0.2.0 && git push origin v0.2.0

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（如 v0.2.0）'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 校验 tag 与 package.json 版本一致
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          if [ ! -f package.json ]; then
            echo "无 package.json，跳过版本校验（tag=$TAG）"
            exit 0
          fi
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG  package.json=$PKG"
          if [ "v$PKG" != "$TAG" ]; then
            echo "::error::tag 与 package.json 版本不一致：tag=$TAG，package.json=v$PKG"
            echo "先改 version 再打 tag。"
            exit 1
          fi

      - name: 语法检查
        run: |
          shopt -s nullglob
          files=(lib/*.js scripts/*.mjs *.mjs)
          if [ ${#files[@]} -eq 0 ]; then echo "无可检查的 JS/MJS 文件"; exit 0; fi
          for f in "${files[@]}"; do node --check "$f"; done
          echo "语法检查通过（${#files[@]} 个文件）"

      - name: 敏感内容复检（发布前最后一道）
        run: |
          node scripts/leakscan.mjs --all
          node scripts/leakscan.mjs --history

      - name: 打包并检查内容
        run: |
          if [ -f package.json ]; then
            npm pack --dry-run
            npm pack
            FULL="$(ls dsh-fnos-*.tgz | head -1)"
            echo "---- 完整包（含全平台 CLI）----"
            ls -lh "$FULL"

            # 分平台包：只保留本平台那一个二进制，体积约为完整包的 1/3。
            # CLI 依旧随包提供，离线可用；只是不再下载用不到的另外 5 个平台。
            for target in win-x64 win-arm64 darwin-x64 darwin-arm64 linux-x64 linux-arm64; do
              rm -rf build && mkdir -p build
              tar -xzf "$FULL" -C build
              rm -f build/package/bin/*
              if ! cp bin/trim-cli-"$target"* build/package/bin/ 2>/dev/null; then
                echo "  跳过 $target（仓库里没有对应二进制）"
                continue
              fi
              tar -czf "dsh-fnos-$target.tgz" -C build package
              echo "  -> dsh-fnos-$target.tgz  $(du -h "dsh-fnos-$target.tgz" | cut -f1)"
            done
            rm -rf build

            # 固定文件名，让 releases/latest/download/dsh-fnos.tgz 永久可用
            cp "$FULL" dsh-fnos.tgz
            echo "---- 全部产物 ----"
            ls -lh *.tgz
          else
            echo "无 package.json，跳过 npm pack"
          fi

      - name: 校验分平台包的 CLI 完整性
        run: |
          if [ -f dsh-fnos.tgz ]; then
            for f in dsh-fnos-*.tgz; do
              case "$f" in
                dsh-fnos.tgz) continue ;;
              esac
              n=$(tar -tzf "$f" | grep -c 'package/bin/trim-cli' || true)
              echo "$f → bin 内文件数 $n"
              if [ "$n" -ne 1 ]; then
                echo "::error::$f 里 CLI 数量不是 1，分平台包构建有问题"
                exit 1
              fi
            done
          fi

      - name: 生成 CLI 校验值
        run: |
          if [ -d bin ]; then
            ( cd bin && sha256sum * > ../checksums.txt )
            echo "---- checksums.txt ----"
            cat checksums.txt
          fi

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          if ls *.tgz >/dev/null 2>&1; then
            # 完整包 + 分平台包 + 固定别名
            ASSETS="dsh-fnos-*.tgz dsh-fnos.tgz"
            # 单独上传各平台 CLI 与校验值：供"包内没有二进制"时按需下载兜底
            if [ -f checksums.txt ]; then ASSETS="$ASSETS checksums.txt"; fi
            if [ -d bin ]; then ASSETS="$ASSETS bin/trim-cli-*"; fi
            gh release create "$TAG" --title "$TAG" --generate-notes $ASSETS
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi

      # 需要发 npm 时，在 Settings → Secrets 配 NPM_TOKEN 后取消注释
      # - name: Publish to npm
      #   if: ${{ env.NPM_TOKEN != '' }}
      #   env:
      #     NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      #   run: |
      #     echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
      #     npm publish --access public
