name: Secret Scan

# 第二道防线（opensource-guard）：即使本地 hook 被 --no-verify 绕过、
# 或从网页/手机直接提交，CI 也会在 push 和 PR 上再扫一遍，且覆盖全历史。

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: 密钥与敏感信息扫描
    runs-on: ubuntu-latest
    steps:
      - name: Checkout（需要全历史）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ① 专业密钥扫描，覆盖全部提交历史
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ② 项目自定义规则：内网地址 / 本机路径 / PII / 硬编码凭据
      - name: 自定义规则 - 当前文件树
        run: node scripts/leakscan.mjs --all

      - name: 自定义规则 - 全部提交历史
        run: node scripts/leakscan.mjs --history
