name: Secret Scan

# 第二道防线（opensource-guard）：即使本地 hook 被 --no-verify 绕过、
# 或从网页/手机直接提交，CI 也会在 push 和 PR 上再扫一遍，且覆盖全历史。

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: 密钥与敏感信息扫描
    runs-on: ubuntu-latest
    steps:
      - name: Checkout（需要全历史）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ① 专业密钥扫描，覆盖全部提交历史
      #
      # 直接用 CLI 而不是 gitleaks/gitleaks-action：后者会按 push 事件推算
      # `before..after` 范围，在「全新仓库首次推送」时会算出 `<根提交>^`，
      # 该父提交不存在 → fatal: ambiguous argument → 动作失败。
      # 用 CLI 扫 --all，行为可预测，且真正覆盖全历史。
      - name: 安装 gitleaks
        run: |
          VERSION=8.24.3
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: gitleaks - 全部提交历史
        run: gitleaks detect --source . --redact -v --exit-code=1 --log-opts="--all"

      # ② 项目自定义规则：内网地址 / 本机路径 / PII / 硬编码凭据
      - name: 自定义规则 - 当前文件树
        run: node scripts/leakscan.mjs --all

      - name: 自定义规则 - 全部提交历史
        run: node scripts/leakscan.mjs --history
